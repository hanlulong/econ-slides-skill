name: CI

# Light checks that need no TeX installation. The full suite compiles decks
# with XeLaTeX, LuaLaTeX and pdfLaTeX; run it locally with bash tests/run-tests.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.pymupdf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            pymupdf: "pymupdf>=1.26,<2"
          - python: "3.12"
            pymupdf: "pymupdf"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install PyMuPDF
        run: python -m pip install --quiet "${{ matrix.pymupdf }}"

      - name: Byte-compile the scripts
        run: python -m py_compile skills/econ-slides/scripts/*.py

      - name: Run the TeX-free tests
        env:
          HOME: ${{ runner.temp }}/home
          TMPDIR: ${{ runner.temp }}/tmp
        run: |
          mkdir -p "$HOME" "$TMPDIR"
          python -I -m unittest discover -s tests -p "test_*.py" -v

  validate:
    name: Skill and plugin validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate the skill with skills-ref
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "skills-ref==0.1.1"
          "$RUNNER_TEMP/venv/bin/agentskills" validate skills/econ-slides

      - name: Validate the Claude Code plugin
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate --strict .
